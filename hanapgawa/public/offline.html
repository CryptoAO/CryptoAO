<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walang koneksyon — HanapGawa</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:#fafaf9; color:#111827;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .card { max-width:420px; text-align:center; background:#fff; border:1px solid #e7e5e4;
          border-radius:16px; padding:28px 24px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  img { width:72px; height:72px; }
  h1 { font-size:22px; margin:16px 0 8px; }
  p { margin:0 0 8px; font-size:15px; color:#4b5563; line-height:1.5; }
  button { margin-top:20px; width:100%; min-height:48px; border:0; border-radius:12px;
           background:#0f766e; color:#fff; font-size:16px; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="HanapGawa">
    <h1>Walang koneksyon</h1>
    <p>Mukhang wala kang internet ngayon. Nasa cellphone mo pa rin ang app — bumalik ka lang kapag may signal na.</p>
    <p><strong>Emergency?</strong> Tumawag sa 911. Hindi kailangan ng internet.</p>
    <button onclick="location.reload()">Subukan ulit</button>
  </div>
</body>
</html>
